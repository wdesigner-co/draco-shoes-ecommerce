  <body data-page="profile">
    <div data-include="components/site-header.html"></div>
    <main id="main-content" class="container page-main">
      <div class="page-title-row">
        <div>
          <span class="eyebrow">Tu espacio Draco Shoes</span>
          <h1>Mi perfil</h1>
          <p>Administra tus datos de contacto y revisa tus pedidos de demostración.</p>
        </div>
      </div>
      <div class="profile-layout">
        <section class="profile-card">
          <div class="panel-heading">
            <div class="profile-avatar">
              <i class="fa-regular fa-user" aria-hidden="true"></i>
            </div>
            <div>
              <h2>Datos personales</h2>
              <p>La información se guarda únicamente en este navegador.</p>
            </div>
          </div>
          <form id="profile-form" class="form-grid">
            <label>Nombre completo
              <input name="name" autocomplete="name" maxlength="100">
            </label>
            <label>Correo electrónico
              <input name="email" type="email" autocomplete="email">
            </label>
            <label>Teléfono
              <input name="phone" type="tel" autocomplete="tel">
            </label>
            <label>Dirección
              <input name="address" autocomplete="street-address">
            </label>
            <label>Ciudad
              <input name="city" autocomplete="address-level2">
            </label>
            <label>Departamento
              <input name="department" autocomplete="address-level1">
            </label>
            <label>Código postal
              <input name="postalCode" autocomplete="postal-code">
            </label>
            <div class="form-span">
              <button class="button button--primary" type="submit">Guardar datos</button>
            </div>
          </form>
        </section>
        <aside class="profile-orders">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">Historial</span>
              <h2>Mis pedidos</h2>
            </div>
          </div>
          <div id="profile-orders" class="order-history-list"></div>
        </aside>
      </div>
    </main>
    <div data-include="components/site-footer.html"></div>
    <div data-include="components/bottom-nav.html"></div>
    <div data-include="components/overlays.html"></div>
